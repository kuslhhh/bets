    <g transform="rotate(-42 50 68)"><path d="M50 22 C54 31 55 42 50 66 C45 42 46 31 50 22 Z"/></g>
    <!-- outer pair (smallest) -->
    <g transform="rotate(62 50 68)"><path d="M50 32 C53 38 54 46 50 62 C46 46 47 38 50 32 Z"/></g>
    <g transform="rotate(-62 50 68)"><path d="M50 32 C53 38 54 46 50 62 C46 46 47 38 50 32 Z"/></g>
